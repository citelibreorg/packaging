name: Build and publish Docker image

on:
  push:
    tags:
      - '*'

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.6.3'
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: citelibre

jobs:

  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Extract application name and version from Git tag
      # Format: {app.name}-{app.version}
      # Example: my-application-1.2.3
      # ---------------------------------------------------------
      - name: Extract application name and version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "Git tag: ${TAG}"

          if [[ "${TAG}" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            APP_NAME="${BASH_REMATCH[1]}"
            APP_VERSION="${BASH_REMATCH[2]}"
          else
            echo "Invalid tag format: ${TAG}"
            echo "Expected format: {app.name}-{app.version}"
            echo "Example: my-application-1.2.3"
            exit 1
          fi

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

          echo "Application name    : ${APP_NAME}"
          echo "Application version : ${APP_VERSION}"

      # ---------------------------------------------------------
      # Setup Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ---------------------------------------------------------
      # Setup Maven
      # ---------------------------------------------------------
      - name: Setup Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      # ---------------------------------------------------------
      # Build application
      # ---------------------------------------------------------
      - name: Build application
        run: |
          mvn --batch-mode clean package -Passembly,${APP_NAME} -Dcitelibre.packaging.version=${APP_VERSION}

      # ---------------------------------------------------------
      # Docker Hub authentication
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME_DOCKER_CITELIBRE }}
          password: ${{ secrets.PASSWORD_DOCKER_CITELIBRE }}

      # ---------------------------------------------------------
      # Build + push Docker image with Jib
      # ---------------------------------------------------------
      - name: Build and push Docker image
        run: |
          echo "Building application: ${APP_NAME}"
          echo "Version: ${APP_VERSION}"
          
          IMAGE="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/packaging-${APP_NAME}:${APP_VERSION}"
          echo "Docker image: ${IMAGE}"

          mvn --batch-mode jib:build -Passembly,${APP_NAME},docker -Dcitelibre.packaging.version=${APP_VERSION} -Djib.to.image=${IMAGE}
